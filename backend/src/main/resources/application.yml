spring:
  application:
    name: bankiko

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bankiko}
    username: ${DB_USERNAME:bankiko}
    password: ${DB_PASSWORD:bankiko_secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_secret}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Application-specific config
bankiko:
  fineract:
    base-url: ${FINERACT_BASE_URL:http://localhost:8443/fineract-provider/api/v1}
    tenant: ${FINERACT_TENANT:default}
    username: ${FINERACT_USERNAME:mifos}
    password: ${FINERACT_PASSWORD:password}
    connect-timeout-seconds: 10
    read-timeout-seconds: 30

  jwt:
    secret: ${JWT_SECRET:bankiko-dev-secret-must-be-changed-in-production-256bit}
    access-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:15}
    refresh-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}

  mpesa:
    base-url: https://sandbox.safaricom.co.ke
    consumer-key: ${MPESA_CONSUMER_KEY:}
    consumer-secret: ${MPESA_CONSUMER_SECRET:}
    shortcode: ${MPESA_SHORTCODE:}
    passkey: ${MPESA_PASSKEY:}
    callback-url: ${MPESA_STK_CALLBACK_URL:http://localhost:8080/api/mpesa/callback/stk}
    b2c-callback-url: ${MPESA_B2C_CALLBACK_URL:http://localhost:8080/api/mpesa/callback/b2c}
    b2c-initiator-name: ${MPESA_B2C_INITIATOR_NAME:}
    b2c-security-credential: ${MPESA_B2C_SECURITY_CREDENTIAL:}
    b2c-queue-timeout-url: ${MPESA_B2C_TIMEOUT_URL:http://localhost:8080/api/mpesa/callback/b2c/timeout}
    # Set to false in production — simulates instant M-Pesa callback for local dev
    simulate-callback: false

  africa-talking:
    api-key: ${AT_API_KEY:}
    username: ${AT_USERNAME:sandbox}
    sender-id: ${AT_SENDER_ID:BANKIKO}

  fcm:
    project-id: ${FCM_PROJECT_ID:}
    service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
  level:
    ke.cliffgor.bankiko: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

bankiko:
  app-url: ${APP_URL:https://bankiko.app}
