services:
  - type: web
    name: bankiko-api
    runtime: docker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bankiko-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bankiko-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY_MINUTES
        value: "15"
      - key: JWT_REFRESH_EXPIRY_DAYS
        value: "7"
      - key: FINERACT_BASE_URL
        value: ""
    healthCheckPath: /actuator/health
    autoDeploy: true

  - type: web
    name: bankiko-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://bankiko.onrender.com"
    healthCheckPath: /
    autoDeploy: true

  - type: redis
    name: bankiko-redis
    plan: free
    ipAllowList: []

databases:
  - name: bankiko-db
    databaseName: bankiko
    user: bankiko
    plan: free
