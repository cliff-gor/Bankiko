services:
  - type: web
    name: bankiko-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DB_URL
        fromDatabase:
          name: bankiko-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: bankiko-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bankiko-db
          property: password
      - key: REDIS_HOST
        fromService:
          type: redis
          name: bankiko-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: bankiko-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: bankiko-redis
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY_MINUTES
        value: "15"
      - key: JWT_REFRESH_EXPIRY_DAYS
        value: "7"
      - key: FINERACT_BASE_URL
        value: ""
      - key: MPESA_SIMULATE_CALLBACK
        value: "true"
    healthCheckPath: /actuator/health
    autoDeploy: true

databases:
  - name: bankiko-db
    databaseName: bankiko
    user: bankiko
    plan: free

  - type: redis
    name: bankiko-redis
    plan: free
    ipAllowList: []
